name: Get anything

on:
  workflow_dispatch:
    inputs:
      link:
        description: 'Link to run wget on.'
        type: string
        required: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      # - name: Scan for Malware
      #   uses: hugoalh/scan-virus-ghaction@v0.20.1
      #   with:
      #     ignores_pre: |-
      #         Param($ElementPreMeta)
      #         Return ($ElementPreMeta.Path -imatch '^.git[\\/]')
              
      - name: get file and push
        run: |
          wget ${{ inputs.link }}
          git config --global user.email "Boss-1s[BOT]@users.noreply.gihub.com"
          git config --global user.name "Boss-1s[BOT]"
          bash push.sh
