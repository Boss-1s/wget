name: code-server

on:
  workflow_dispatch:
    inputs:
      time:
        type: number
        default: 1
        required: true
        description: time to run server in mins

jobs:
  debug-environment:
    runs-on: ubuntu-latest
    steps:
      - name: Install code-server
        uses: jcbhmr/setup-code-server@v1
      
      - name: Start code-server with tunnel
        # Using cloudflared to expose the local server to the web
        run: |
          # 1. Start code-server using its default config.yml settings
           code-server &
           
           # 2. Give the server a moment to boot up and generate the password
           sleep 5

           # 3. Extract and print the generated password to your workflow logs
           echo "=================================================="
           echo " YOUR CODE-SERVER PASSWORD IS:"
           grep 'password:' ~/.config/code-server/config.yml | awk '{print $2}'
           echo "=================================================="

           # 4. Create an SSH tunnel. This routes the runner's port 8080 to a public SSH endpoint.
           # The 'StrictHostKeyChecking=no' bypasses the prompt so it runs seamlessly in automation.
           ssh -R 80:localhost:8080 -o StrictHostKeyChecking=no nokey@localhost.run &

           # 5. Keep the runner open so you can connect and work
           sleep ${{inputs.time}}m

           echo Ending server. Thank you for using code-server.
