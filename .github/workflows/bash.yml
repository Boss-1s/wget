name: Run anything single-line bash

on:
  workflow_dispatch:
    inputs:
      run:
        description: 'Bash cmd to run.'
        type: string
        required: true
      repo:
        description: '[Optional] Repo to check out, in format owner/repo'
        type: string
        default: Boss-1s/wget
        required: false
      commit:
        description: 'Commit any changes to the above repo?'
        type: boolean
        default: true
        required: false

      python:
        description: 'Setup Python'
        type: boolean
        default: false
        required: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        if: ${{ inputs.repo != '' }}
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repo }}

      - name: Setup Python
        if: inputs.python
        uses: actions/setup-python@v7

      - name: run command
        run: ${{inputs.run}}

      - name: commit and push
        if: inputs.commit
        run: |
          git config --global user.email "Boss-1s[BOT]@users.noreply.gihub.com"
          git config --global user.name "Boss-1s[BOT]"
          bash push.sh
